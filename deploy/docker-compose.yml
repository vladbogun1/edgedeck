# EdgeDeck на сервере. Этот файл — единственное, что лежит в ~/edgedeck:
# исходников на сервере нет, образ тянется из GHCR (DESIGN.md §11.1).
#
#   cd ~/edgedeck && docker compose pull && docker compose up -d
#
# Наружу ничего не публикуется: в панель попадают только через Caddy.

name: edgedeck

services:
  # Сайдкар с доступом к Docker. Белый список из шести операций, docker.sock
  # смонтирован только сюда и только на чтение.
  agent:
    image: ${EDGEDECK_IMAGE}
    container_name: edgedeck-agent
    command: ["--agent"]
    restart: unless-stopped
    environment:
      EDGEDECK_AGENT_TOKEN: ${EDGEDECK_AGENT_TOKEN}
      EDGEDECK_EDGE_NETWORK: ${EDGEDECK_EDGE_NETWORK:-edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/healthz"]
      interval: 30s
      timeout: 5s
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Сборщик правил фаервола. Единственный контейнер с CAP_NET_ADMIN, и он
  # намеренно НИКУДА не слушает: раз в 30 секунд пишет снимок правил в файл,
  # который панель читает только на чтение. Записать правила через него нельзя.
  firewall:
    image: ${EDGEDECK_IMAGE}
    container_name: edgedeck-firewall
    command: ["--firewall"]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    cap_drop:
      - ALL
    volumes:
      - ./state:/state
      - /etc/ufw:/host/etc/ufw:ro
    # Проверка здоровья своя: базовая из образа стучится в порт панели, которого
    # у этого контейнера нет. Здесь признак жизни — свежий снимок правил.
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/firewall.json"]
      interval: 60s
      timeout: 5s
      start_period: 40s
    logging: *logs

  panel:
    image: ${EDGEDECK_IMAGE}
    container_name: edgedeck
    restart: unless-stopped
    depends_on: [agent]
    environment:
      EDGEDECK_AGENT_URL: http://edgedeck-agent:4001
      EDGEDECK_AGENT_TOKEN: ${EDGEDECK_AGENT_TOKEN}
      EDGEDECK_TLS_ASK_TOKEN: ${EDGEDECK_TLS_ASK_TOKEN}
      EDGEDECK_CADDY_ADMIN: ${EDGEDECK_CADDY_ADMIN:-http://edge_caddy:2019}
      EDGEDECK_EDGE_NETWORK: ${EDGEDECK_EDGE_NETWORK:-edge}
      EDGEDECK_PUBLIC_IP: ${EDGEDECK_PUBLIC_IP:-}
      EDGEDECK_INITIAL_PASSWORD: ${EDGEDECK_INITIAL_PASSWORD:-}
      # Уведомления: без них панель молчит, а молчание — плохой признак состояния.
      EDGEDECK_TELEGRAM_TOKEN: ${EDGEDECK_TELEGRAM_TOKEN:-}
      EDGEDECK_TELEGRAM_CHAT: ${EDGEDECK_TELEGRAM_CHAT:-}
      # Флот (PLAN.md Q-1): общий секрет, реестр серверов «id|подпись|адрес панели|адрес для браузера», кто я.
      EDGEDECK_FLEET: ${EDGEDECK_FLEET:-}
      EDGEDECK_FLEET_SECRET: ${EDGEDECK_FLEET_SECRET:-}
      EDGEDECK_SERVER_ID: ${EDGEDECK_SERVER_ID:-}
      # Свои зоны без маршрутов на этом сервере (например bogun.site на s2 для s2.bogun.site).
      EDGEDECK_TRUSTED_ZONES: ${EDGEDECK_TRUSTED_ZONES:-}
      # Единый вход (PLAN.md Q-2): домен cookie и адрес страницы входа (хаб).
      EDGEDECK_SSO_DOMAIN: ${EDGEDECK_SSO_DOMAIN:-}
      EDGEDECK_SSO_LOGIN: ${EDGEDECK_SSO_LOGIN:-}
    volumes:
      # Каталог Caddy: на этапе 0 только читаем, дальше будем писать routes.yaml.
      - ${EDGE_DIR:-/home/ubuntu/edge}:/edge
      # Своё состояние: пароль, сессии, замеченные домены, журнал.
      - ./data:/data
      # /proc хоста — чтобы видеть порты процессов вне докера.
      - /proc:/host/proc:ro
      # Сертификаты Caddy: только чтение, удалить их панель не может физически.
      - caddy_data:/caddy-data:ro
      # Снимок правил фаервола от контейнера firewall — только на чтение.
      # Каталог намеренно вынесен из ./data: иначе панель могла бы писать в него
      # через свой rw-монтаж, и «только чтение» было бы фикцией.
      - ./state:/state:ro
    networks: [edge]
    logging: *logs

networks:
  edge:
    external: true
    name: ${EDGEDECK_EDGE_NETWORK:-edge}

volumes:
  caddy_data:
    external: true
    name: ${CADDY_DATA_VOLUME:-edge_caddy_data}
